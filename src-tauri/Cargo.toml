[package]
name = "pid-desktop"
version = "0.2.29"
description = "Pi Desktop - a Codex-style desktop client for the Pi coding agent"
authors = ["PIDesktop"]
license = "Apache-2.0"
repository = "https://github.com/Llllviaaaa/PIDesktop"
homepage = "https://github.com/Llllviaaaa/PIDesktop"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pid_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "unstable", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
json5 = "0.4"
dirs = "6"
base64 = "0.22"
portable-pty = "0.9"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ureq = { version = "2.12", features = ["json"] }
urlencoding = "2"
# RUSTSEC-2026-0382. rustls 0.23.46 accepts rustls-webpki ^0.103.14.
rustls-webpki = "=0.103.16"
# RUSTSEC-2026-0381. The 1.x package is the patched root store. ureq still
# requires the 0.26 name; the patch below supplies that name from a local
# re-export of this exact release.
webpki-roots = "=1.0.10"

[target.'cfg(windows)'.dependencies]
png = "0.17"
uiautomation = "0.25"
windows-capture = "=2.0.1"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Security_Cryptography",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(windows))'.dependencies]
libc = "0.2"

[patch.crates-io]
# RUSTSEC-2026-0381. crates.io has no patched webpki-roots 0.26 release, and
# ureq 2.12.1 will not accept 1.0.10 under its ^0.26 requirement. The local
# crate keeps that name and version, then re-exports TLS_SERVER_ROOTS from
# the patched 1.0.10 package pinned above.
webpki-roots = { path = "../vendor/webpki-roots-compat" }
