[package]
name = "qianji"
version = "0.3.0"
description = "Qianji (千机) - a local-first desktop environment fusing Agent Workbench, autonomous Bot, and IDE"
authors = ["Qianji"]
license = "Apache-2.0"
repository = "https://github.com/Llllviaaaa/Qianji"
homepage = "https://github.com/Llllviaaaa/Qianji"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "qianji_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dirs = "6"
base64 = "0.22"
portable-pty = "0.9"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(windows)'.dependencies]
png = "0.17"
uiautomation = "0.25"
webview2-com = "0.39"
windows-capture = "=2.0.1"
windows-core = "0.62"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Security_Cryptography",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(windows))'.dependencies]
libc = "0.2"
