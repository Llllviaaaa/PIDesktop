<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="18%" cy="28%" r="48%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="84%" cy="68%" r="45%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="55%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="logoBoxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="cardShadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#0f172a" stroke-width="0.6" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="340" rx="20" fill="url(#bgGrad)" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect width="1200" height="340" rx="20" fill="url(#grid)"/>
  <rect width="1200" height="340" rx="20" fill="url(#glowBlue)"/>
  <rect width="1200" height="340" rx="20" fill="url(#glowCyan)"/>

  <!-- Left Brand Emblem -->
  <g transform="translate(68, 56)">
    <rect x="0" y="0" width="84" height="84" rx="22" fill="url(#logoBoxGrad)" stroke="#93c5fd" stroke-width="1.5" filter="url(#cardShadow)"/>
    <!-- Geometric Qianji Mark -->
    <path d="M 24 28 L 60 28 M 42 20 L 42 64 M 24 46 L 60 46 M 30 60 L 54 60" stroke="url(#brandGrad)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="60" cy="28" r="4" fill="#0d9488"/>
    <circle cx="24" cy="46" r="4" fill="#2563eb"/>

    <!-- Title & Subtitle -->
    <text x="108" y="44" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="40" font-weight="800" fill="#0f172a" letter-spacing="-0.5">
      千机 <tspan fill="url(#brandGrad)">Qianji</tspan>
    </text>
    <rect x="334" y="18" width="112" height="26" rx="13" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
    <text x="390" y="35" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="600" fill="#1d4ed8">v0.3 · Local</text>

    <text x="108" y="76" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="500" fill="#475569">
      融合 <tspan fill="#0f172a" font-weight="700">Agent 工作台</tspan> · <tspan fill="#0f172a" font-weight="700">自主运行 Bot</tspan> · <tspan fill="#0f172a" font-weight="700">轻量级 IDE</tspan> 的本地优先桌面创造环境
    </text>
  </g>

  <!-- Three Core Pillars Cards -->
  <g transform="translate(68, 172)">
    <!-- Card 1 -->
    <g transform="translate(0, 0)">
      <rect width="336" height="118" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#cardShadow)"/>
      <circle cx="28" cy="30" r="13" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="28" y="35" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="700" fill="#2563eb">01</text>
      <text x="50" y="35" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#0f172a">Agent 智能工作台</text>
      <text x="20" y="64" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="13" fill="#475569">• 多模型流式推理 · 子代理并发委派</text>
      <text x="20" y="85" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="13" fill="#475569">• Intelligent UI 双引擎分屏交互画布</text>
      <text x="20" y="105" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#2563eb">MCP · Browser CDP · Computer Use</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(364, 0)">
      <rect width="336" height="118" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#cardShadow)"/>
      <circle cx="28" cy="30" r="13" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
      <text x="28" y="35" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="700" fill="#059669">02</text>
      <text x="50" y="35" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#0f172a">自主运行 Bot 与插件内核</text>
      <text x="20" y="64" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="13" fill="#475569">• 单进程 Harness Host (Cordis 微内核)</text>
      <text x="20" y="85" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="13" fill="#475569">• 三级动态插件覆盖与零刷新全栈 HMR</text>
      <text x="20" y="105" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#059669">Schedules · Memory 2.0 · DPAPI</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(728, 0)">
      <rect width="336" height="118" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#cardShadow)"/>
      <circle cx="28" cy="30" r="13" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
      <text x="28" y="35" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="700" fill="#0284c7">03</text>
      <text x="50" y="35" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#0f172a">原生 IDE 与 Git 审查闭环</text>
      <text x="20" y="64" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="13" fill="#475569">• CodeMirror 6 编辑器 · Hunk 级 Git 审查</text>
      <text x="20" y="85" font-family="Inter, 'Microsoft YaHei', sans-serif" font-size="13" fill="#475569">• 无侵入 Git 快照回退 · 多标签 ConPTY</text>
      <text x="20" y="105" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#0284c7">Worktree · GitHub PR Loop · Sandbox</text>
    </g>
  </g>
</svg>
