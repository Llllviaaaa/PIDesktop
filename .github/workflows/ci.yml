name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend and integration tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run test:unit
      - run: npm run build

  rust:
    name: Rust tests
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.96.1 --profile minimal --component clippy --component rustfmt
      - name: Verify GLib is absent from the Windows dependency tree
        shell: pwsh
        run: |
          $tree = cargo tree --manifest-path src-tauri/Cargo.toml --locked --target x86_64-pc-windows-msvc --prefix none
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $glib = @($tree | Select-String -Pattern '^glib v')
          if ($glib.Count -gt 0) {
            $glib | ForEach-Object { Write-Error "Unexpected Windows GLib dependency: $_" }
            exit 1
          }
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  rust-audit:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.96.1 --profile minimal
      - run: cargo install cargo-audit --locked
      - run: cargo audit --file src-tauri/Cargo.lock
